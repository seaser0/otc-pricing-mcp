apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otc-pricing-mcp
  namespace: mcp-otc-pricing
  labels:
    app: otc-pricing-mcp
spec:
  # Single replica: minAvailable: 1 would block every node drain forever. maxUnavailable: 1 still
  # limits voluntary disruptions to one pod and lets kubectl drain proceed.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: otc-pricing-mcp
